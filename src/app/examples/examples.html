<p class="app-label">Exemples sur Amazon</p>
<ul class="app-examples__list">
  @for (product of products(); track product.id) {
    <li>
      <a
        class="app-examples__link"
        [href]="url(product)"
        target="_blank"
        rel="sponsored noopener noreferrer"
      >
        {{ product.name }}<span class="fd-sr"> (nouvel onglet)</span>
      </a>
      <span class="app-examples__brand">{{ product.brand }}</span>
      @if (isGear(product)) {
        <span class="app-examples__details"
          >Caractéristiques&nbsp;: {{ product.details.join(', ') }}</span
        >
      } @else {
        <span class="app-examples__composition"
          >Composition&nbsp;: {{ product.ingredients.join(', ') }}</span
        >
      }
    </li>
  }
</ul>
